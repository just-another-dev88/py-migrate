name: "migrate_single_to_multi"
description: "Streams data from a single Oracle source and replicates it across multiple Postgres targets."

source_db: "oracle_source"

target_db:
  - "postgres_target_replica1"
  - "postgres_target_replica2"

streaming:
  chunk_size: 1000
  itersize: 1000

pre_migration:
  - name: "Check Oracle source table exists"
    type: "sql_exists"
    database: "source"
    query: "SELECT 1 FROM all_tables WHERE table_name = 'USERS'"

  - name: "Check target tables exist on all replicas"
    type: "sql_exists"
    database: "target"
    query: "SELECT 1 FROM information_schema.tables WHERE table_name = 'users'"

mapping:
  source_query: "SELECT USER_ID, EMAIL_ADDR FROM USERS"
  target_table: "users"
  rollback_strategy: "transaction"

  columns:
    - source: "USER_ID"
      target: "id"
      type: "integer"

    - source: "EMAIL_ADDR"
      target: "email"
      transform: "lower(value).strip()"
      type: "string"

post_migration:
  - name: "Verify replicated target row counts match source"
    type: "row_count_match"
    source_query: "SELECT COUNT(*) FROM USERS"
    target_query: "SELECT COUNT(*) FROM users"
