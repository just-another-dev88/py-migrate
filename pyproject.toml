[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-migrate"
version = "0.1.0"
description = "A declarative data migration tool supporting Oracle Thin, Postgres, streaming, and transactional rollbacks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "oracledb>=2.0.0",
    "psycopg2-binary>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
pymigrate = "pymigrate.cli:main"
